<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Logo PDV</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }
        img {
            max-width: 80%;
            max-height: 60vh;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .legenda {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        /* Painel de configuração inicialmente OCULTO */
        .config-painel {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .config-painel input {
            padding: 8px;
            font-size: 13px;
            width: 90%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .config-botoes {
            display: flex;
            gap: 10px;
        }
        .config-painel button {
            padding: 8px 15px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-salvar { background: #28a745; color: white; }
        .btn-fechar { background: #dc3545; color: white; }
    </style>
</head>
<body>

    <!-- Imagem e Legenda limpas na tela -->
    <img id="logoImg" src="" alt="Logo do PDV">
    <div id="logoLegenda" class="legenda"></div>

    <!-- Painel oculto que só abre ao clicar no botão do menu principal -->
    <div class="config-painel" id="painelConfig">
        <h3 style="color: #0056b3; margin-bottom: 5px; font-size: 15px;">Configurar Logo e Legenda</h3>
        <input type="text" id="inputUrl" placeholder="Cole a URL da imagem aqui...">
        <input type="text" id="inputLegenda" placeholder="Digite a legenda...">
        <div class="config-botoes">
            <button class="btn-salvar" onclick="salvarLogo()">Salvar Alteração</button>
            <button class="btn-fechar" onclick="toggleConfig()">Fechar (X)</button>
        </div>
    </div>

    <script>
        function carregarLogo() {
            let urlSalva = localStorage.getItem('pdv_logo_url');
            let legendaSalva = localStorage.getItem('pdv_logo_legenda');

            if (!urlSalva) {
                urlSalva = "https://cdn-icons-png.flaticon.com/512/3081/3081559.png";
            }
            if (!legendaSalva) {
                legendaSalva = "PDV EXPRESSO";
            }

            document.getElementById('logoImg').src = urlSalva;
            document.getElementById('logoLegenda').innerText = legendaSalva;
            document.getElementById('inputUrl').value = urlSalva === "https://cdn-icons-png.flaticon.com/512/3081/3081559.png" ? "" : urlSalva;
            document.getElementById('inputLegenda').value = legendaSalva;
        }

        // Função chamada pelo botão lá de cima do index.html para abrir/fechar o painel
        function toggleConfig() {
            let painel = document.getElementById('painelConfig');
            if (painel.style.display === "flex") {
                painel.style.display = "none";
            } else {
                painel.style.display = "flex";
                document.getElementById('inputUrl').focus();
            }
        }

        function salvarLogo() {
            let novaUrl = document.getElementById('inputUrl').value.trim();
            let novaLegenda = document.getElementById('inputLegenda').value.trim();

            if (novaUrl) {
                localStorage.setItem('pdv_logo_url', novaUrl);
            }
            if (novaLegenda) {
                localStorage.setItem('pdv_logo_legenda', novaLegenda);
            }

            alert("Logo atualizada com sucesso!");
            toggleConfig();
            carregarLogo();
        }

        carregarLogo();
    </script>
</body>
</html>
