<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Vendas - PDV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f0f2f5; padding: 20px; }
        
        .container { max-width: 900px; background: white; margin: 0 auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; margin-bottom: 20px; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background-color: #f8f9fa; color: #333; }
        
        .btn-back { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; font-weight: bold; }
        .btn-back:hover { text-decoration: underline; }
        
        .total-geral { margin-top: 20px; font-size: 18px; font-weight: bold; text-align: right; color: #333; }

        .limpar-container {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .limpar-container input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .limpar-container button {
            padding: 8px 15px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .limpar-container button:hover {
            background-color: #c9302c;
        }

        -estoque {
        display: inline-block;
        background-color: #004aad; /* Azul padrão do sistema */
        color: white;
        padding: 8px 16px;
        text-decoration: none;
        font-weight: bold;
        border-radius: 4px;
        font-size: 13px;
        margin-bottom: 15px;
        transition: background-color 0.2s;

    }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="btn-back">⬅ Voltar para o PDV</a>
        <h2>Histórico de Vendas Realizadas</h2>
        
        <!-- Área do input e botão de limpeza com senha -->
        <div class="limpar-container">
            <input type="password" id="codigoLimpeza" placeholder="Digite o código...">
            <button onclick="limparHistorico()">Limpar Histórico</button>
        </div>
        <div class="sub-menu">
        <a href="estoque.html" class="btn-estoque">📦 Ver Estoque</a>

        <table>
            <thead>
                <tr>
                    <th>ID da Venda</th>
                    <th>Data / Hora</th>
                    <th>Forma de Pagamento</th>
                    <th>Valor Total (R$)</th>
                </tr>
            </thead>
            <tbody id="salesTableBody">
                <!-- Vendas reais entram aqui -->
            </tbody>
        </table>

        <div class="total-geral" id="totalGeralVendas">
            Faturamento Total: R$ 0,00
        </div>
    </div>

    <script>
        async function carregarRelatorio() {
            try {
                const response = await fetch('/api/sales');
                const sales = await response.json();

                const tbody = document.getElementById('salesTableBody');
                tbody.innerHTML = "";
                let faturamentoTotal = 0;

                if (sales.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #666;">Nenhuma venda registrada ainda.</td></tr>`;
                    return;
                }

                sales.forEach(sale => {
                    faturamentoTotal += sale.total;
                    let dataFormatada = new Date(sale.created_at).toLocaleString('pt-BR');
                    
                    let row = `<tr>
                        <td>#${String(sale.id).padStart(4, '0')}</td>
                        <td>${dataFormatada}</td>
                        <td>${sale.payment_method}</td>
                        <td style="font-weight: bold; color: #28a745;">R$ ${sale.total.toFixed(2)}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });

                document.getElementById('totalGeralVendas').innerText = `Faturamento Total: R$ ${faturamentoTotal.toFixed(2)}`;
            } catch (error) {
                console.error("Erro ao carregar relatório:", error);
                alert("Erro ao buscar dados do servidor.");
            }
        }

        async function limparHistorico() {
            const codigo = document.getElementById('codigoLimpeza').value;
            
            if (codigo === "2332") {
                if (confirm("Tem certeza que deseja apagar todo o histórico de vendas?")) {
                    try {
                        const response = await fetch('http://localhost:3000/api/sales', {
                            method: 'DELETE'
                        });
                        
                        if (response.ok) {
                            alert("Histórico limpo com sucesso!");
                            location.reload();
                        } else {
                            alert("Erro ao limpar histórico no servidor. (Verifique se a rota DELETE foi criada no backend)");
                        }
                    } catch (error) {
                        console.error("Erro:", error);
                        alert("Erro de conexão com o servidor ao tentar apagar.");
                    }
                }
            } else {
                alert("Código incorreto! Ação negada.");
                document.getElementById('codigoLimpeza').value = "";
            }
        }

        carregarRelatorio();
    </script>
</body>
</html>
