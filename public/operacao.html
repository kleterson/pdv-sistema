<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Expresso - Operação de Caixa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
        .top-bar { background-color: #0056b3; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: bold; }
        .container { padding: 20px; flex: 1; max-width: 600px; margin: 20px auto; width: 100%; background: white; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; margin-bottom: 20px; border-bottom: 2px solid #0056b3; padding-bottom: 5px; font-size: 18px; }
        .op-card { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 5px; margin-bottom: 15px; }
        .op-card h3 { font-size: 15px; margin-bottom: 10px; color: #333; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 3px; }
        .form-group input { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-action { background-color: #007bff; color: white; border: none; padding: 8px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
        .btn-action:hover { background-color: #0056b3; }
        .btn-back { background-color: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="top-bar">
        <span>Operações de Caixa (Suprimento / Sangria)</span>
        <a href="/" class="btn-back">Voltar ao Caixa</a>
    </div>

    <div class="container">
        <h2>Controle de Turno e Movimento</h2>
        
        <div class="op-card">
            <h3>Suprimento de Caixa (Adicionar Troco Inicial)</h3>
            <div class="form-group">
                <label>Valor (R$):</label>
                <input type="number" id="suprimentoValue" placeholder="0.00">
            </div>
            <button class="btn-action" onclick="registrarMovimento('Suprimento')">Confirmar Suprimento</button>
        </div>

        <div class="op-card">
            <h3>Sangria de Caixa (Retirar Dinheiro)</h3>
            <div class="form-group">
                <label>Valor (R$):</label>
                <input type="number" id="sangriaValue" placeholder="0.00">
            </div>
            <button class="btn-action" style="background-color: #dc3545;" onclick="registrarMovimento('Sangria')">Confirmar Sangria</button>
        </div>
    </div>

    <script>
        function registrarMovimento(tipo) {
            let inputId = tipo === 'Suprimento' ? 'suprimentoValue' : 'sangriaValue';
            let val = parseFloat(document.getElementById(inputId).value) || 0;
            if(val <= 0) {
                alert("Digite um valor válido!");
                return;
            }
            alert(`✅ ${tipo} de R$ ${val.toFixed(2)} registrado com sucesso no caixa!`);
            document.getElementById(inputId).value = "";
        }
    </script>
</body>
</html>
